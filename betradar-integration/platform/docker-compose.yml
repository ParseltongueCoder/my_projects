# Platform dev stack: simulator (RabbitMQ + mock Betradar API) + PostgreSQL + UOF adapter + monitoring.
#   Grafana http://localhost:3000 (dashboard "UOF Feed Health"), Prometheus http://localhost:9090/alerts
#   ../uof-simulator/tools/gen-tls.sh && docker compose up -d --build
name: uof-platform

include:
  - ../uof-simulator/docker-compose.yml

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
      POSTGRES_DB: platform
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform"]
      interval: 5s
      retries: 20

  uof-adapter:
    build: .
    restart: on-failure     # the SDK refuses to start until the (mock) API answers
    environment:
      ConnectionStrings__Platform: Host=postgres;Database=platform;Username=platform;Password=platform
      Uof__Environment: Custom
      Uof__ApiHost: uofsim:8080
      Uof__MessagingHost: rabbitmq
      Uof__MessagingPort: "5671"
      Uof__MessagingPassword: sim
    ports:
      - "8081:8081"     # /metrics (Prometheus), /healthz
    depends_on:
      postgres:
        condition: service_healthy
      uofsim:
        condition: service_started

  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus:/etc/prometheus:ro

  grafana:
    image: grafana/grafana:12.1.0
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"        # local dev only
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  pgdata:
