# Platform dev stack: simulator (RabbitMQ + mock Betradar API) + PostgreSQL + UOF adapter + monitoring.
#   Feed Ops admin http://localhost:8088 (login operator/operator or viewer/viewer - dev users),
#   Grafana http://localhost:3000 (dashboard "UOF Feed Health"), Prometheus http://localhost:9090/alerts
#   ../uof-simulator/tools/gen-tls.sh && docker compose up -d --build
name: uof-platform

include:
  - ../uof-simulator/docker-compose.yml

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
      POSTGRES_DB: platform
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform"]
      interval: 5s
      retries: 20

  uof-adapter:
    build: .
    restart: on-failure     # the SDK refuses to start until the (mock) API answers
    environment:
      ConnectionStrings__Platform: Host=postgres;Database=platform;Username=platform;Password=platform
      Uof__Environment: Custom
      Uof__ApiHost: uofsim:8080
      Uof__MessagingHost: rabbitmq
      Uof__MessagingPort: "5671"
      Uof__MessagingPassword: sim
    ports:
      - "8081:8081"     # /metrics (Prometheus), /healthz
    depends_on:
      postgres:
        condition: service_healthy
      uofsim:
        condition: service_started

  keycloak:
    image: keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm"]
    ports:
      - "8180:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Browsers reach Keycloak on localhost:8180; containers on keycloak:8080. Tokens carry the
      # browser-facing issuer, back-channel URLs (JWKS) follow the request host.
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./deploy/keycloak/feedops-realm.json:/opt/keycloak/data/import/feedops-realm.json:ro

  admin-api:
    build:
      context: .
      args:
        PROJECT: Admin.Api
    environment:
      ConnectionStrings__Platform: Host=postgres;Database=platform;Username=platform;Password=platform
      Auth__Authority: http://localhost:8180/realms/feedops
      Auth__MetadataAddress: http://keycloak:8080/realms/feedops/.well-known/openid-configuration
      Auth__RequireHttpsMetadata: "false"
      Simulator__BaseUrl: http://uofsim:8080      # dev/demo only: enables the Simulator page
    depends_on:
      postgres:
        condition: service_healthy

  admin-web:
    build: ../admin/admin-web
    ports:
      - "8088:80"
    environment:
      FEEDOPS_AUTH_ENABLED: "true"
      FEEDOPS_AUTH_AUTHORITY: http://localhost:8180/realms/feedops
      FEEDOPS_GRAFANA_URL: http://localhost:3000/d/uof-feed-health
    depends_on:
      - admin-api
      - keycloak

  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus:/etc/prometheus:ro

  grafana:
    image: grafana/grafana:12.1.0
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"        # local dev only
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  pgdata:
